backend:
  name: github
  repo: Kiranhashmi867/kiranhashmi.online
  branch: main

media_folder: "images/blog"
public_folder: "/images/blog"

publish_mode: simple

collections:
  - name: "posts"
    label: "Blog Posts"
    folder: "_posts"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish Date", name: "date", widget: "datetime" }
      - { label: "Category", name: "category", widget: "select", options: ["SEO", "Link Building", "Local SEO", "Content Writing", "Digital Marketing"] }
      - { label: "Read Time", name: "read_time", widget: "string", default: "4 min read" }
      - { label: "Featured Image", name: "image", widget: "image" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Body", name: "body", widget: "markdown" }
